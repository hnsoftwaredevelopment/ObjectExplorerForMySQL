name: Build

on:
  push:
    branches: [main, "us-*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  CONFIGURATION: Release

jobs:
  build:
    # windows-2025 has Visual Studio 2026 since June 2026. The VSIX project needs
    # Visual Studio's MSBuild; `dotnet build` cannot build it.
    runs-on: windows-2025

    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up .NET SDK from global.json
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Set up Visual Studio MSBuild
        uses: microsoft/setup-msbuild@v3
        with:
          vs-version: "[18.0,)"

      - name: Restore and build
        run: msbuild ObjectExplorerForMySql.slnx -restore -m -nologo -warnaserror -p:Configuration=${{ env.CONFIGURATION }} -p:DeployExtension=false

      - name: Run unit tests
        run: dotnet test --project tests/ObjectExplorerForMySql.Core.Tests --configuration ${{ env.CONFIGURATION }} --no-build

      - name: Upload VSIX
        uses: actions/upload-artifact@v7
        with:
          name: ObjectExplorerForMySql-vsix
          path: src/ObjectExplorerForMySql.Vsix/bin/${{ env.CONFIGURATION }}/net48/ObjectExplorerForMySql.vsix
          if-no-files-found: error
          retention-days: 30
